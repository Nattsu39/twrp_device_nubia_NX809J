name: TWRP 16 Builder

on:
  workflow_dispatch:
    inputs:
      TWRP_MANIFEST_URL:
        description: "TWRP manifest url"
        required: true
        default: "https://github.com/TWRP-Test/platform_manifest_twrp_aosp"
      TWRP_MANIFEST_BRANCH:
        description: "TWRP branch"
        required: true
        default: "twrp-16.0"
      DEVICE_TREE_URL:
        description: "Device tree url"
        required: true
        default: "https://github.com/zxdzxv/twrp_device_nubia_NX809J"
      DEVICE_TREE_BRANCH:
        description: "Device tree branch"
        required: true
        default: "twrp-16.0"
      DEVICE_PATH:
        description: "Device path device/"
        required: true
        default: "nubia/NX809J"
      DEVICE_NAME:
        description: "Device name"
        required: true
        default: "NX809J"
      LUNCH_TARGET:
        description: "lunch twrp_ (default same as device name)"
        required: false
        default: ""
      BUILD_PARTITION:
        description: "Build partition"
        required: true
        default: "recovery"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Show build info
      run: |
        if [ -n "${{ github.event.inputs.LUNCH_TARGET }}" ]; then
          echo "LUNCH_TARGET=${{ github.event.inputs.LUNCH_TARGET }}" >> "$GITHUB_ENV"
        else
          echo "LUNCH_TARGET=${{ github.event.inputs.DEVICE_NAME }}" >> "$GITHUB_ENV"
        fi
        {
          echo 'BUILD_INFO<<EOF'
          echo
          echo Manifest url: ${{ github.event.inputs.TWRP_MANIFEST_URL }}
          echo Manifest branch: ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }}
          echo Device tree url: ${{ github.event.inputs.DEVICE_TREE_URL }}
          echo Device tree branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}
          echo Device path: ${{ github.event.inputs.DEVICE_PATH }}
          echo Device name: ${{ github.event.inputs.DEVICE_NAME }}
          echo Lunch target: ${{ github.event.inputs.LUNCH_TARGET }}
          echo Build target: ${{ github.event.inputs.BUILD_PARTITION }}.img
          echo Build date: `date`
          echo
          echo EOF
        } >> "$GITHUB_ENV"
        echo BUILD_DATE=`date +%F` >> "$GITHUB_ENV"
        echo "REPO_NAME=$(basename ${{ github.event.inputs.TWRP_MANIFEST_URL }})" >> "$GITHUB_ENV"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Maximize build space
      uses: easimon/maximize-build-space@master

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        create-symlink: true

    - name: Setup zram
      run: |
        sudo apt install linux-modules-extra-$(uname -r) zram-tools -y
        sudo modprobe zram
        sudo sed -i 's/^#PERCENT=50/PERCENT=90/' /etc/default/zramswap
        sudo sed -i 's/^#PRIORITY=100/PRIORITY=1000/' /etc/default/zramswap
        sudo systemctl restart zramswap
        zramctl

    - name: Setup environment
      run: |
        export DEBIAN_FRONTEND=noninteractive
        sudo apt update && sudo apt upgrade -y
        sudo apt install repo -y
        git config --global user.name ${{ github.actor }}
        git config --global user.email ${{ github.actor }}@users.noreply.github.com

    - name: Sync source
      run: |
        repo init -u ${{ github.event.inputs.TWRP_MANIFEST_URL }} -b ${{ github.event.inputs.TWRP_MANIFEST_BRANCH }} --depth=1
        (while true; do echo "Syncing source..."; sleep 60; done) &
        TIP_PID=$!
        repo sync
        kill $TIP_PID && exit 0

    - name: Setup device
      run: |
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} device/${{ github.event.inputs.DEVICE_PATH }}

    - name: Generate build info
      run: |
        echo -e "$BUILD_INFO" >> INFO.txt
        echo "Change log:" >> INFO.txt
        set +e
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null)
        if [ $? -eq 0 ]; then
          git log "$LAST_TAG"..HEAD --pretty=format:"- %h-%an: %s" >> INFO.txt
        else
          git log --pretty=format:"- %h-%an: %s" >> INFO.txt
        fi
        cat INFO.txt
      working-directory: device/${{ github.event.inputs.DEVICE_PATH }}

    # ── TWRP 触摸坐标缩放修复 ─────────────────────────────────────────────
    # TWRP 的 vk_tp_to_screen() 用驱动"声明"的 ABS 量程来缩放触摸坐标:
    #
    #     *x = (p->x - p->xi.minimum) * (fb_width - 1) / (p->xi.maximum - p->xi.minimum);
    #
    # NX809J 的 synaptics_tcm 驱动在 recovery 环境下声明 ABS_MT_POSITION_X 的
    # max=12159 / Y 的 max=26879, 也就是面板分辨率(1216x2688)的 10 倍; 但它
    # 实际上报的值只有面板像素单位 0..1215 / 0..2679 (在正常 Android 启动时
    # 上报的是 0..12159 的 IC 单位, 两边行为不同, 原因在 vendor 侧)。
    #
    # 结果: 屏幕上的每一次触摸都被除以 10, 全部挤到左上角约 122x262 像素的
    # 区域里, 界面看起来完全点不动 —— 但 evdev 层数据是正常流动的。
    #
    # 修复: 缩放前把明显不合理的量程夹到 framebuffer 尺寸。
    # 正常设备的 ABS 量程不会超过 fb 大小, 所以这段对其他机型无副作用。
    - name: Patch TWRP touch scaling
      run: |
        python3 - <<'PYEOF'
        import pathlib, sys
        p = pathlib.Path("bootable/recovery/twrpminui/events.cpp")
        s = p.read_text()
        if "NX809J touch range fix" in s:
            print("already patched, skipping")
            sys.exit(0)
        anchor = "    *x = (p->x - p->xi.minimum) * (fb_width - 1) / (p->xi.maximum - p->xi.minimum);"
        if anchor not in s:
            print("ERROR: anchor line not found in vk_tp_to_screen()")
            sys.exit(1)
        fix = (
            "    /* NX809J touch range fix: the synaptics_tcm driver advertises an ABS\n"
            "     * range 10x larger than the values it actually reports in recovery\n"
            "     * (max 12159/26879 but reported values are panel pixels 0..1215/0..2679),\n"
            "     * which scales every touch into the top-left corner.  Clamp an\n"
            "     * implausible range down to the framebuffer size. */\n"
            "    if (p->xi.maximum - p->xi.minimum > fb_width) {\n"
            "        p->xi.minimum = 0;\n"
            "        p->xi.maximum = fb_width - 1;\n"
            "    }\n"
            "    if (p->yi.maximum - p->yi.minimum > fb_height) {\n"
            "        p->yi.minimum = 0;\n"
            "        p->yi.maximum = fb_height - 1;\n"
            "    }\n"
        )
        s = s.replace(anchor, fix + anchor, 1)
        p.write_text(s)
        print("patched " + str(p))
        PYEOF
        echo "--- 结果 ---"
        grep -n -B1 -A12 "NX809J touch range fix" bootable/recovery/twrpminui/events.cpp

    - name: Build TWRP
      run: |
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        export CCACHE_DIR=.ccache
        export CCACHE_EXEC=$(command -v ccache)        
        export CCACHE_MAXSIZE=5G
        export USE_CCACHE=1
        lunch twrp_${{ env.LUNCH_TARGET }}
        (while true; do echo `date +%T` "Building TWRP..."; free -h; sleep 10; done) &
        TIP_PID=$!
        m ${{ github.event.inputs.BUILD_PARTITION }}image
        mv out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_PARTITION }}.img out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
        kill $TIP_PID && exit 0        

    - name: Show image info
      run: |
        echo "=== output dir ==="
        ls -l out/target/product/${{ github.event.inputs.DEVICE_NAME }}/
        echo
        echo "=== image checksum ==="
        sha256sum out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-*.img

    # Release API 挂了也不怕: 产物先存成 artifact, 用 actions/download-artifact 或
    # 网页上 artifact 区都能拿。此前 GitHub API 故障导致 release 三次 500 丢过产物。
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        path: out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-*.img
        if-no-files-found: warn
        retention-days: 14

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: | 
          out/target/product/${{ github.event.inputs.DEVICE_NAME }}/TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}.img
        name: TWRP-3.7.1-16-${{ github.event.inputs.DEVICE_NAME }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
        tag_name: ${{ env.BUILD_DATE }}-${{ github.run_id }}
        body_path: device/${{ github.event.inputs.DEVICE_PATH }}/INFO.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
